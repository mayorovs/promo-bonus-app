# Isolated development environment for this repository only.
# Project name is pinned so it can never share resources with other local projects.
name: promo-bonus-app

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      # Host port is configurable to avoid collisions with other local projects.
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-promo_bonus}
      POSTGRES_USER: ${DB_USERNAME:-promo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Deliberately not 5432, so a default Postgres on the host stays reachable.
      - "${DB_PORT_HOST:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-promo} -d ${DB_DATABASE:-promo_bonus}"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      # node_modules deliberately stays inside the bind mount rather than in a
      # named volume, so the editor on the host can resolve Vue and the Vite
      # asset types. Git ignores it through frontend/.gitignore.
      - ./frontend:/app
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev"

volumes:
  pgdata:
